<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply a saved light/dark override before the page paints to avoid a flash.
    // With nothing saved, the page follows the system color scheme.
    try {
      var savedTheme = JSON.parse(localStorage.getItem('todo-theme'));
      if (savedTheme === 'light' || savedTheme === 'dark') document.querySelector('meta[name="color-scheme"]').content = savedTheme;
    } catch (e) {}
  </script>
  <title>TODO App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1 data-i18n="title">My Tasks</h1>
      <div class="controls">
        <label class="visually-hidden" for="language-select" data-i18n="language">Language</label>
        <select id="language-select">
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="pt">Português</option>
          <option value="es">Español</option>
          <option value="pl">Polski</option>
        </select>
        <button id="theme-toggle" type="button" class="icon-button">
          <span class="theme-to-dark"><span aria-hidden="true">🌙</span><span class="visually-hidden" data-i18n="darkMode">Switch to dark mode</span></span>
          <span class="theme-to-light"><span aria-hidden="true">☀️</span><span class="visually-hidden" data-i18n="lightMode">Switch to light mode</span></span>
        </button>
      </div>
    </header>

    <div id="account-bar" class="account-bar" hidden>
      <span id="account-email" class="account-email"></span>
      <button id="sign-out" type="button" class="text-button" data-i18n="signOut">Sign out</button>
    </div>

    <div id="verify-banner" class="notice" hidden>
      <span data-i18n="verifyBanner">Please confirm your email address. Check your inbox for the link.</span>
      <button id="resend-verification" type="button" class="text-button" data-i18n="resendEmail">Resend email</button>
    </div>

    <p id="status-message" class="notice" role="status" hidden></p>

    <section id="auth-view" class="auth-view" aria-labelledby="auth-heading" hidden>
      <h2 id="auth-heading"></h2>
      <form id="auth-form" class="auth-form">
        <div id="auth-email-field" class="field">
          <label for="auth-email" data-i18n="email">Email</label>
          <input id="auth-email" name="email" type="email" autocomplete="username" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="254" required>
        </div>
        <div id="auth-password-field" class="field">
          <label id="auth-password-label" for="auth-password" data-i18n="password">Password</label>
          <small id="auth-password-hint" class="hint" data-i18n="passwordHint" hidden>At least 8 characters.</small>
          <input id="auth-password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        </div>
        <label id="auth-remember-field" class="checkbox">
          <input id="auth-remember" name="remember" type="checkbox">
          <span data-i18n="rememberMe">Keep me signed in</span>
        </label>
        <p id="auth-error" class="form-error" role="alert" hidden></p>
        <button id="auth-submit" type="submit" class="primary-button"></button>
      </form>
      <div class="auth-links">
        <button id="auth-switch" type="button" class="text-button"></button>
        <button id="auth-forgot" type="button" class="text-button" data-i18n="forgotPassword">Forgot your password?</button>
      </div>
    </section>

    <div id="todo-view" hidden>
      <form id="todo-form" class="todo-form">
        <label class="visually-hidden" for="todo-input" data-i18n="placeholder">What needs to be done?</label>
        <input id="todo-input" name="text" type="text" autocomplete="off" enterkeyhint="done" maxlength="200" data-i18n-placeholder="placeholder" placeholder="What needs to be done?">
        <button type="submit" data-i18n="add">Add</button>
      </form>

      <nav class="filters" aria-label="Filters">
        <button type="button" data-filter="all" data-i18n="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" data-i18n="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="completed" data-i18n="completed" aria-pressed="false">Completed</button>
      </nav>

      <ul id="todo-list" class="todo-list" role="list"></ul>
      <p id="empty-message" class="empty" data-i18n="empty">Nothing to do. Enjoy your day!</p>

      <footer class="app-footer">
        <span id="items-left"></span>
        <button id="clear-completed" type="button" class="link-button" data-i18n="clearCompleted">Clear completed</button>
      </footer>
    </div>
  </main>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
