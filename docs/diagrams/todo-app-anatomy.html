<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}</style>
<title>TODO App Anatomy</title>
<style>
  /* Layout: single reading column, three full-width figures, each in its own horizontal scroller on narrow screens. */
  :root {
    --bg: #f7f7fa;
    --panel: #ffffff;
    --ink: #1c1e26;
    --muted: #5d6272;
    --line: #cfd2dc;
    --accent: #4f46e5;
    --accent-bg: #eceeff;
    --store: #15803d;
    --store-bg: #e8f7ee;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, Consolas, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12131a; --panel: #1b1d27; --ink: #e7e8ee; --muted: #9a9fb0; --line: #3a3e4d;
      --accent: #8b93ff; --accent-bg: #23264a; --store: #4ade80; --store-bg: #14301f;
      color-scheme: dark;
    }
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 var(--sans);
    padding-block: 40px 64px;
    padding-inline: 16px;
  }
  main { max-width: 960px; margin-inline: auto; display: grid; gap: 56px; }
  header { display: grid; gap: 8px; max-width: 65ch; }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 38px); line-height: 1.15; font-weight: 600; text-wrap: balance; }
  h2 { margin: 0 0 12px; font-size: 20px; font-weight: 600; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); }
  code { font-family: var(--mono); font-size: 0.9em; }

  figure { margin: 0; }
  .scroll {
    overflow-x: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
  }
  .scroll svg { display: block; width: 100%; height: auto; min-width: 760px; }
  figcaption { margin-top: 12px; max-width: 70ch; color: var(--muted); }

  /* SVG marks, all driven by the page tokens so both themes work */
  svg text { font-family: var(--sans); }
  .h { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .t { font-size: 12px; fill: var(--ink); }
  .m { font-size: 12px; fill: var(--muted); }
  .l { font-size: 11px; fill: var(--muted); }
  .ls { font-size: 11px; fill: var(--store); }
  .cap { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--muted); }
  svg .mono { font-family: var(--mono); }
  .mono.m, .mono.l { font-size: 11px; }
  .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
  .box-a { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 1.2; }
  .box-s { fill: var(--store-bg); stroke: var(--store); stroke-width: 1.2; }
  .group { fill: none; stroke: var(--store); stroke-width: 1.2; stroke-dasharray: 6 4; }
  .ln { fill: none; stroke: var(--muted); stroke-width: 1.5; }
  .ln-a { fill: none; stroke: var(--accent); stroke-width: 1.8; }
  .ln-s { fill: none; stroke: var(--store); stroke-width: 1.8; }
  .dash { stroke-dasharray: 5 4; }
  .ah { fill: var(--muted); }
  .ah-a { fill: var(--accent); }
  .ah-s { fill: var(--store); }
  .dot { fill: var(--muted); }
  .ring { fill: none; stroke: var(--muted); stroke-width: 1.5; }
</style>

</head>
<body>
<main>
  <header>
    <h1>TODO App Anatomy</h1>
    <p>How the four files fit together, what happens between a click and the saved result, and the states a single task passes through. Drawn from <code>index.html</code>, <code>app.js</code> and <code>i18n.js</code>.</p>
  </header>

  <section>
    <h2>Four files, one load order</h2>
    <figure>
      <div class="scroll">
        <svg viewBox="0 0 900 460" role="img" aria-label="index.html loads styles.css, then i18n.js, then app.js; app.js uses the TRANSLATIONS global from i18n.js, looks up elements in index.html, and loads from and saves to localStorage.">
          <defs>
            <marker id="f1n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
            <marker id="f1s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah-s"/></marker>
          </defs>

          <rect class="box" x="330" y="30" width="220" height="100" rx="8"/>
          <text class="h" x="344" y="54">index.html</text>
          <text class="t" x="344" y="74">form, filters, list, footer</text>
          <text class="m" x="344" y="94">inline script sets the saved</text>
          <text class="m" x="344" y="110">theme before first paint</text>

          <rect class="box" x="20" y="210" width="220" height="80" rx="8"/>
          <text class="h" x="34" y="234">styles.css</text>
          <text class="t" x="34" y="254">light colors by default</text>
          <text class="m" x="34" y="272">dark under [data-theme]</text>

          <rect class="box" x="330" y="210" width="220" height="80" rx="8"/>
          <text class="h" x="344" y="234">i18n.js</text>
          <text class="t" x="344" y="254">TRANSLATIONS table</text>
          <text class="m" x="344" y="272">en  fr  pt  es  pl</text>

          <rect class="box-a" x="660" y="190" width="220" height="120" rx="8"/>
          <text class="h" x="674" y="214">app.js</text>
          <text class="t" x="674" y="236">state and event handlers</text>
          <text class="t" x="674" y="254">render() redraws the page</text>
          <text class="t" x="674" y="272">t() looks up translated text</text>

          <path class="ln" d="M330 80 H130 V210" marker-end="url(#f1n)"/>
          <text class="l" x="230" y="74" text-anchor="middle">&lt;link&gt;</text>

          <path class="ln" d="M440 130 V210" marker-end="url(#f1n)"/>
          <text class="l" x="450" y="176">&lt;script&gt; 1st</text>

          <path class="ln" d="M550 70 H770 V190" marker-end="url(#f1n)"/>
          <text class="l" x="660" y="64" text-anchor="middle">&lt;script&gt; 2nd, runs last</text>

          <path class="ln" d="M550 250 H660" marker-end="url(#f1n)"/>
          <text class="l" x="605" y="244" text-anchor="middle">TRANSLATIONS</text>

          <path class="ln dash" d="M730 190 V160 H500 V130" marker-end="url(#f1n)"/>
          <text class="l" x="615" y="154" text-anchor="middle">finds elements by id and data-*</text>

          <path class="ln-s" d="M700 310 V360" marker-end="url(#f1s)"/>
          <text class="ls" x="692" y="340" text-anchor="end">save() on change</text>
          <path class="ln-s dash" d="M770 360 V310" marker-end="url(#f1s)"/>
          <text class="ls" x="778" y="340">load() at startup</text>

          <rect class="box-s" x="560" y="360" width="320" height="76" rx="8"/>
          <text class="h" x="574" y="384">localStorage</text>
          <text class="t mono" x="574" y="402" style="font-size:11px">todo-items · todo-theme · todo-lang</text>
          <text class="m" x="574" y="420" style="font-size:11px">index.html also reads todo-theme</text>

          <path class="ln" d="M20 392 H56" marker-end="url(#f1n)"/>
          <text class="l" x="66" y="396">loads, calls or writes</text>
          <path class="ln dash" d="M20 416 H56" marker-end="url(#f1n)"/>
          <text class="l" x="66" y="420">looks up or reads back</text>
        </svg>
      </div>
      <figcaption><code>index.html</code> pulls in the other files in a fixed order. <code>i18n.js</code> defines the <code>TRANSLATIONS</code> global before <code>app.js</code> runs, so swapping those two script tags would break the app. <code>app.js</code> then finds its elements in the page and is the only file that writes saved data. It reads all three keys, and a small inline script in <code>index.html</code> reads <code>todo-theme</code> early to avoid a flash of the wrong colors.</figcaption>
    </figure>
  </section>

  <section>
    <h2>From click to screen and storage</h2>
    <figure>
      <div class="scroll">
        <svg viewBox="0 0 880 560" role="img" aria-label="Each user action changes an in-memory variable in app.js. Changes to todos, theme and lang are saved to localStorage and redrawn on screen; the filter is redrawn but never saved. localStorage is read once at startup.">
          <defs>
            <marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah-a"/></marker>
            <marker id="f2n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
            <marker id="f2s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah-s"/></marker>
          </defs>

          <text class="cap" x="20" y="40">What the user does</text>
          <text class="cap" x="310" y="40">In memory (app.js)</text>
          <text class="cap" x="620" y="40">On screen</text>

          <!-- triggers -->
          <rect class="box" x="20" y="60" width="180" height="40" rx="8"/>
          <text class="t" x="34" y="85">Click a filter tab</text>
          <rect class="box" x="20" y="134" width="180" height="40" rx="8"/>
          <text class="t" x="34" y="159">Type text, press Add</text>
          <rect class="box" x="20" y="184" width="180" height="40" rx="8"/>
          <text class="t" x="34" y="209">Tick a checkbox</text>
          <rect class="box" x="20" y="234" width="180" height="40" rx="8"/>
          <text class="t" x="34" y="259">Click ✕ on a task</text>
          <rect class="box" x="20" y="284" width="180" height="40" rx="8"/>
          <text class="t" x="34" y="309">Click Clear completed</text>
          <rect class="box" x="20" y="334" width="180" height="40" rx="8"/>
          <text class="t" x="34" y="359">Click the theme button</text>
          <rect class="box" x="20" y="384" width="180" height="40" rx="8"/>
          <text class="t" x="34" y="409">Pick a language</text>

          <!-- trigger -> state -->
          <path class="ln-a" d="M200 80 H310" marker-end="url(#f2a)"/>
          <text class="l" x="255" y="74" text-anchor="middle">set filter</text>
          <path class="ln-a" d="M200 154 H310" marker-end="url(#f2a)"/>
          <text class="l mono" x="255" y="148" text-anchor="middle">addTodo()</text>
          <path class="ln-a" d="M200 204 H310" marker-end="url(#f2a)"/>
          <text class="l mono" x="255" y="198" text-anchor="middle">toggleTodo()</text>
          <path class="ln-a" d="M200 254 H310" marker-end="url(#f2a)"/>
          <text class="l mono" x="255" y="248" text-anchor="middle">deleteTodo()</text>
          <path class="ln-a" d="M200 304 H310" marker-end="url(#f2a)"/>
          <text class="l" x="255" y="298" text-anchor="middle">drop done tasks</text>
          <path class="ln-a" d="M200 354 H310" marker-end="url(#f2a)"/>
          <text class="l" x="255" y="348" text-anchor="middle">flip theme</text>
          <path class="ln-a" d="M200 404 H310" marker-end="url(#f2a)"/>
          <text class="l" x="255" y="398" text-anchor="middle">set lang</text>

          <!-- state -->
          <rect class="box-a" x="310" y="60" width="200" height="40" rx="8"/>
          <text class="h mono" x="324" y="77">filter</text>
          <text class="l" x="324" y="92">not saved, resets to All</text>

          <text class="ls" x="300" y="117">these three are saved</text>
          <rect class="group" x="298" y="124" width="224" height="310" rx="10"/>

          <rect class="box-a" x="310" y="134" width="200" height="190" rx="8"/>
          <text class="h mono" x="324" y="158">todos</text>
          <text class="t mono" x="324" y="178" style="font-size:11px">[{ id, text, done }, …]</text>
          <text class="l" x="324" y="196">one object per task</text>
          <rect class="box-a" x="310" y="334" width="200" height="40" rx="8"/>
          <text class="h mono" x="324" y="351">theme</text>
          <text class="l" x="324" y="366">light or dark</text>
          <rect class="box-a" x="310" y="384" width="200" height="40" rx="8"/>
          <text class="h mono" x="324" y="401">lang</text>
          <text class="l" x="324" y="416">en  fr  pt  es  pl</text>

          <!-- state -> screen -->
          <path class="ln-a" d="M510 80 H620" marker-end="url(#f2a)"/>
          <text class="l mono" x="565" y="74" text-anchor="middle">render()</text>
          <path class="ln-a" d="M510 229 H620" marker-end="url(#f2a)"/>
          <text class="l mono" x="565" y="223" text-anchor="middle">render()</text>
          <path class="ln-a" d="M510 354 H620" marker-end="url(#f2a)"/>
          <text class="l mono" x="565" y="348" text-anchor="middle">applyTheme()</text>
          <path class="ln-a" d="M510 404 H620" marker-end="url(#f2a)"/>
          <text class="l mono" x="565" y="398" text-anchor="middle">applyLanguage()</text>

          <!-- screen -->
          <rect class="box" x="620" y="60" width="240" height="40" rx="8"/>
          <text class="h" x="634" y="77">Tab highlight</text>
          <text class="m" x="634" y="92">which tasks are listed</text>
          <rect class="box" x="620" y="134" width="240" height="190" rx="8"/>
          <text class="h" x="634" y="158">Task list</text>
          <text class="t" x="634" y="178">rows rebuilt on every change</text>
          <text class="t" x="634" y="196">empty-state message</text>
          <text class="t" x="634" y="214">“N items left” counter</text>
          <text class="t" x="634" y="232">Clear completed button, shown</text>
          <text class="t" x="634" y="250">only when a task is done</text>
          <rect class="box" x="620" y="334" width="240" height="40" rx="8"/>
          <text class="h" x="634" y="351">Colors and icon</text>
          <text class="m" x="634" y="366">sets data-theme on the page</text>
          <rect class="box" x="620" y="384" width="240" height="40" rx="8"/>
          <text class="h" x="634" y="401">All text</text>
          <text class="m" x="634" y="416">labels, placeholder, title, list</text>

          <!-- storage -->
          <path class="ln-s" d="M360 434 V478" marker-end="url(#f2s)"/>
          <text class="ls" x="352" y="462" text-anchor="end">save() on change</text>
          <path class="ln-s dash" d="M470 478 V434" marker-end="url(#f2s)"/>
          <text class="ls" x="478" y="462">load() at startup</text>
          <rect class="box-s" x="310" y="478" width="200" height="70" rx="8"/>
          <text class="h" x="324" y="502">localStorage</text>
          <text class="t mono" x="324" y="520" style="font-size:11px">todo-items, todo-theme,</text>
          <text class="t mono" x="324" y="536" style="font-size:11px">todo-lang</text>

          <text class="l" x="20" y="490">First visit, nothing saved yet:</text>
          <text class="l" x="20" y="508">theme follows the system setting</text>
          <text class="l" x="20" y="526">and language follows the browser.</text>
        </svg>
      </div>
      <figcaption>Every action changes a variable in memory first, then saves it and redraws the screen from that variable. The screen is never built from <code>localStorage</code>, which is read once when the page loads. The filter is the exception to saving: it lives in memory only, so a reload returns to All.</figcaption>
    </figure>
  </section>

  <section>
    <h2>Life of a task</h2>
    <figure>
      <div class="scroll">
        <svg viewBox="0 0 960 320" role="img" aria-label="A task is created Active when text is submitted, toggles between Active and Done when its checkbox is ticked or unticked, and is removed from either state with the ✕ button or, when Done, with Clear completed.">
          <defs>
            <marker id="f3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah-a"/></marker>
            <marker id="f3n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
          </defs>

          <circle class="dot" cx="40" cy="135" r="8"/>
          <text class="l" x="40" y="112" text-anchor="middle">no task yet</text>

          <path class="ln-a" d="M48 135 H240" marker-end="url(#f3a)"/>
          <text class="l" x="144" y="127" text-anchor="middle">Add: submit non-empty text</text>
          <text class="l" x="144" y="152" text-anchor="middle">blank input is ignored</text>

          <rect class="box-a" x="240" y="80" width="200" height="110" rx="8"/>
          <text class="h" x="254" y="104">Active</text>
          <text class="t mono" x="254" y="124" style="font-size:11px">done: false</text>
          <text class="m" x="254" y="144">listed under All, Active</text>
          <text class="m" x="254" y="162">counted in “N items left”</text>

          <rect class="box" x="540" y="80" width="200" height="110" rx="8"/>
          <text class="h" x="554" y="104">Done</text>
          <text class="t mono" x="554" y="124" style="font-size:11px">done: true</text>
          <text class="m" x="554" y="144">listed under All, Completed</text>
          <text class="m" x="554" y="162">text struck through (.done)</text>

          <path class="ln-a" d="M440 115 H540" marker-end="url(#f3a)"/>
          <text class="l" x="490" y="108" text-anchor="middle">tick</text>
          <path class="ln-a" d="M540 155 H440" marker-end="url(#f3a)"/>
          <text class="l" x="490" y="172" text-anchor="middle">untick</text>

          <path class="ln-a" d="M740 135 H884" marker-end="url(#f3a)"/>
          <text class="l" x="812" y="127" text-anchor="middle">✕ or Clear completed</text>

          <path class="ln-a" d="M340 190 V260 H900 V151" marker-end="url(#f3a)"/>
          <text class="l" x="620" y="252" text-anchor="middle">✕ on an active task</text>

          <circle class="ring" cx="900" cy="135" r="14"/>
          <circle class="dot" cx="900" cy="135" r="8"/>
          <text class="l" x="900" y="108" text-anchor="middle">removed</text>

          <text class="l" x="20" y="300">Every arrow ends with save() then render().</text>
        </svg>
      </div>
      <figcaption>A task is one object whose only changing field is <code>done</code>. Because each transition saves <code>todo-items</code> before redrawing, a reload brings every task back in the state it was in. Clear completed removes all Done tasks at once; the ✕ button removes a single task from either state.</figcaption>
    </figure>
  </section>
</main>
</body>
</html>
