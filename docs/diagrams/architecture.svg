<svg viewBox="0 0 720 440" width="720" height="440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>TODO app architecture</title>
  <style>
    .bg { fill: #ffffff }
    .panel { fill: #f4f5f7; stroke: #d5d8de }
    .box { fill: #ffffff; stroke: #b8bdc7 }
    .acc { fill: #eef0ff; stroke: #4f46e5 }
    .store { fill: #ecfdf3; stroke: #16a34a }
    .t { fill: #1f2328 }
    .m { fill: #5b6370 }
    .h { fill: #1f2328; font-weight: 700 }
    .ln { stroke: #4f46e5; stroke-width: 2; fill: none }
    .ah { fill: #4f46e5 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14161b }
      .panel { fill: #1c1f26; stroke: #3a3f4a }
      .box { fill: #23262e; stroke: #4a505c }
      .acc { fill: #25264a; stroke: #818cf8 }
      .store { fill: #16301f; stroke: #4ade80 }
      .t, .h { fill: #e6e8eb }
      .m { fill: #9aa1ab }
      .ln { stroke: #818cf8 }
      .ah { fill: #818cf8 }
    }
  </style>
  <rect class="bg" width="720" height="440"/>

  <!-- Backend: only delivers the files -->
  <text class="h" x="20" y="40" font-size="15">Backend</text>
  <text class="m" x="20" y="60" font-size="12">Only delivers the files. Pick one:</text>
  <rect class="box" x="20" y="80" width="200" height="56" rx="8"/>
  <text class="t" x="34" y="104" font-size="13" font-weight="600">Your disk</text>
  <text class="m" x="34" y="123" font-size="12">double-click index.html</text>
  <rect class="box" x="20" y="156" width="200" height="56" rx="8"/>
  <text class="t" x="34" y="180" font-size="13" font-weight="600">Python http.server</text>
  <text class="m" x="34" y="199" font-size="12">localhost:8000, your PC</text>
  <rect class="box" x="20" y="232" width="200" height="56" rx="8"/>
  <text class="t" x="34" y="256" font-size="13" font-weight="600">claude.ai</text>
  <text class="m" x="34" y="275" font-size="12">the TODO App link</text>
  <text class="m" x="20" y="320" font-size="12">No app code runs here.</text>
  <text class="m" x="20" y="338" font-size="12">No database, no API.</text>

  <path class="ln" d="M220 184 H292"/>
  <path class="ah" d="M300 184 l-10 -6 v12 z"/>
  <text class="m" x="228" y="170" font-size="11">sends 4 files</text>
  <text class="m" x="228" y="202" font-size="11">once</text>

  <!-- Frontend: the browser runs the app -->
  <rect class="panel" x="300" y="20" width="400" height="400" rx="14"/>
  <text class="h" x="320" y="48" font-size="15">Frontend: your browser</text>
  <text class="m" x="320" y="66" font-size="12">The whole app runs here</text>
  <rect class="box" x="320" y="82" width="174" height="56" rx="8"/>
  <text class="t" x="334" y="106" font-size="13" font-weight="600">index.html</text>
  <text class="m" x="334" y="125" font-size="12">page layout</text>
  <rect class="box" x="506" y="82" width="174" height="56" rx="8"/>
  <text class="t" x="520" y="106" font-size="13" font-weight="600">styles.css</text>
  <text class="m" x="520" y="125" font-size="12">light and dark colors</text>
  <rect class="box" x="320" y="150" width="174" height="56" rx="8"/>
  <text class="t" x="334" y="174" font-size="13" font-weight="600">i18n.js</text>
  <text class="m" x="334" y="193" font-size="12">EN FR PT ES PL text</text>
  <rect class="acc" x="506" y="150" width="174" height="56" rx="8"/>
  <text class="t" x="520" y="174" font-size="13" font-weight="600">app.js</text>
  <text class="m" x="520" y="193" font-size="12">logic: add, tick, delete</text>

  <rect class="box" x="320" y="232" width="360" height="44" rx="8"/>
  <text class="t" x="334" y="259" font-size="13">You click and type, app.js redraws the list</text>
  <path class="ln" d="M593 206 V224"/>
  <path class="ah" d="M593 232 l-6 -10 h12 z"/>

  <path class="ln" d="M500 276 V294"/>
  <path class="ah" d="M500 302 l-6 -10 h12 z"/>
  <text class="m" x="508" y="292" font-size="11">save / load</text>
  <rect class="store" x="320" y="302" width="360" height="60" rx="8"/>
  <text class="t" x="334" y="326" font-size="13" font-weight="600">localStorage</text>
  <text class="m" x="334" y="346" font-size="12">tasks, theme, language (stays in this browser)</text>
  <text class="m" x="320" y="396" font-size="12">Nothing is sent to the internet after the files load.</text>
</svg>
